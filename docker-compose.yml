services:
  neo4j:
    image: neo4j:5.11.0
    ports: 
      - "7475:7474"
      - "7688:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PW}
    volumes:
      - neo4j_data:/data

  stemgraph-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PW}
      - WRITE_TOKEN=${WRITE_TOKEN}
    depends_on:
      - neo4j

volumes:
  neo4j_data: